# .github/workflows/agent-ci.yml
#
# CI + auto-deploy for StackTrack.
# Every push and PR: lint, format check, typecheck, tests, build, and a
# security scan (secret detection + SAST + dependency audit).
# Pushes to main that pass validate AND security additionally deploy dist/ to
# the existing Cloudflare Pages project (same URL as manual deploys:
# https://stacktrack-ea9.pages.dev).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — scoped to Cloudflare Pages : Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Neither value ever lives in this repo.

name: CI & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # hand the exact validated build to the deploy job — deploy never rebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — trufflehog needs full history to diff the pushed range
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scanning — detects accidentally committed credentials.
      # Pinned to a release tag (not @main) so the security job itself is not
      # an unpinned supply-chain dependency. base/head are deliberately
      # omitted: the action auto-detects the commit range per event.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --results=verified,unknown

      # Static analysis (SAST) — catches injection, XSS, eval-on-input, and
      # other dangerous patterns. `--config auto` selects rules for whatever
      # languages are present. Findings fail the build; triage in the
      # decision log (fix, or suppress with same-line justification).
      - name: Static analysis (semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error .

      # Dependency audit — detects vulnerable npm packages.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stacktrack --branch main
