# .github/workflows/agent-ci.yml
#
# CI + auto-deploy for StackTrack.
# Every push and PR: lint, format check, typecheck, tests, build, and a
# security scan (secret detection + SAST + dependency audit).
# Pushes to main that pass validate AND security additionally deploy dist/ to
# the existing Cloudflare Pages project (same URL as manual deploys:
# https://stacktrack-ea9.pages.dev).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — scoped to Cloudflare Pages : Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Neither value ever lives in this repo.

name: CI & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  deployments: write

# All third-party actions are pinned to full commit SHAs (tags are mutable and
# can be repointed — supply-chain risk). The trailing comment holds the human-
# readable version; Dependabot (github-actions ecosystem) keeps both updated.
jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # hand the exact validated build to the deploy job — deploy never rebuilds
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — trufflehog needs full history to diff the pushed range
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Secret scanning — detects accidentally committed credentials.
      # base/head are deliberately omitted: the action auto-detects the
      # commit range per event.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown

      # Static analysis (SAST) — catches injection, XSS, eval-on-input, and
      # other dangerous patterns. `--config auto` selects rules for whatever
      # languages are present. Findings fail the build; triage in the
      # decision log (fix, or suppress with same-line justification).
      - name: Static analysis (semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error .

      # Dependency audit — detects vulnerable npm packages.
      # Scoped to PRODUCTION deps: this project ships a static client bundle +
      # a Cloudflare Worker (prod runtime = workerd / native fetch). The
      # high-sev advisories npm reports are all in dev/deploy tooling
      # (wrangler, esbuild, miniflare, undici, ws) that never reaches users;
      # production deps (react, dexie, recharts) audit clean. Dependabot
      # (.github/dependabot.yml, weekly) tracks the dev-tooling updates
      # non-blocking. See DECISION_LOG 2026-06-18.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stacktrack --branch main
