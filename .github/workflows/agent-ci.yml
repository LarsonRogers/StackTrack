# .github/workflows/agent-ci.yml
#
# CI + auto-deploy for StackTrack.
# Every push and PR: lint, format check, typecheck, tests, build.
# Pushes to main that pass all checks additionally deploy dist/ to the
# existing Cloudflare Pages project (same URL as manual deploys:
# https://stacktrack-ea9.pages.dev).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — scoped to Cloudflare Pages : Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Neither value ever lives in this repo.

name: CI & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # hand the exact validated build to the deploy job — deploy never rebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stacktrack --branch main
