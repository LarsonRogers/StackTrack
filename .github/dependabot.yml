# .github/dependabot.yml — dependency update cadence.
#
# cooldown: wait a few days before proposing a newly published version —
# protection against compromised releases that get yanked shortly after
# publish (supply-chain hygiene; also satisfies semgrep's
# dependabot-missing-cooldown rule).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Keeps the SHA-pinned actions in .github/workflows/ updated — without
  # this, commit-pinned actions never receive update PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
